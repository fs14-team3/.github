name: 버그 제보
description: 예상과 다르게 동작하는 문제
labels: ['bug']
projects: ['fs14-team3/1']
body:
  - type: textarea
    id: problem
    attributes:
      label: 현상
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
  - type: textarea
    id: environment
    attributes:
      label: 환경
      placeholder: 브라우저/OS, 브랜치 또는 배포 환경
  - type: textarea
    id: logs
    attributes:
      label: 스크린샷 / 로그
